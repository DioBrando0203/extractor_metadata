[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msg-metadata-extractor"
version = "0.1.0"
description = "API local y efímera para extraer MSG y metadatos de adjuntos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "extract-msg>=0.52,<1",
  "olefile>=0.47,<1",
  "Pillow>=11,<13",
  "pypdf>=6,<7",
  "ezdxf>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1", "openpyxl>=3.1,<4", "python-docx>=1.1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
